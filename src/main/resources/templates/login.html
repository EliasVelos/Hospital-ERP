<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Hospital-ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4 login-card">
        <h1 class="h3 text-center login-title mb-3">Acesso ao hospital</h1>
        <p class="text-center">Entre com o usuário e a senha cadastrados pela administração.</p>
        <div th:if="${param.logout}" class="alert alert-success" role="status">Você saiu do sistema.</div>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">Não foi possível entrar. Confira seu usuário e sua senha.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
