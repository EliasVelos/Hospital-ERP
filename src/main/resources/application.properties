spring.application.name=hospital
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hospital}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.bootstrap.enabled=${HOSPITAL_BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${HOSPITAL_ADMIN_USERNAME:}
app.bootstrap.password=${HOSPITAL_ADMIN_PASSWORD:}
app.migrate-legacy-passwords=${HOSPITAL_MIGRATE_LEGACY_PASSWORDS:false}
