# --- Configurações do Banco de Dados (PostgreSQL) ---
# O Railway injeta a URL completa (host, porta, banco) nesta variável
spring.datasource.url=${DATABASE_URL}

# Credenciais injetadas automaticamente pelo Railway
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configurações do Hibernate / JPA ---

# 'update' cria as tabelas automaticamente se elas não existirem
spring.jpa.hibernate.ddl-auto=update

# Dialeto específico para o PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostra as queries SQL no log (bom para testar no celular)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Configuração de Porta ---

# O Railway define a porta que o app deve rodar via variável de ambiente
server.port=${PORT:8080}
